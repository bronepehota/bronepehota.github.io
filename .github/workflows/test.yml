name: Test

on:
  push:
    branches: [main, develop, cucumber-fixes, battle-redesign]
  pull_request:
    branches: [main, develop, battle-redesign]
    types: [opened, synchronize]

jobs:
  # Быстрые проверки - всегда запускаются
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

  # E2E тесты - только для PR в main и push в main/develop
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main')
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Kill any existing process on port 3001
        run: |
          lsof -ti:3001 | xargs kill -9 2>/dev/null || echo "Port 3001 is free"
          sleep 2

      - name: Start dev server in background with logging
        run: |
          mkdir -p logs
          NEXT_PUBLIC_GA_MEASUREMENT_ID=G-TEST NEXT_PUBLIC_YANDEX_METRICA_ID=111302711 nohup npm run dev:e2e > logs/server.log 2>&1 &
          echo $! > logs/server.pid
          echo "Server started with PID: $(cat logs/server.pid)"

      - name: Wait for app to be ready with retries
        run: |
          for i in {1..24}; do
            if curl -s http://localhost:3001 > /dev/null; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/24: Server not ready yet, waiting 3s..."
            sleep 3
          done
          echo "Server failed to start after 72s"
          echo "Server logs:"
          cat logs/server.log || true
          exit 1

      - name: Run E2E tests
        run: npm run test:e2e:ci

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: logs/

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: e2e/reports/

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: e2e/screenshots/

      - name: Kill server
        if: always()
        run: |
          if [ -f logs/server.pid ]; then
            pid=$(cat logs/server.pid)
            kill $pid 2>/dev/null || true
          fi
