# Cucumber configuration file
# https://cucumber.io/docs/cucumber/configuration/

default:
  # Load support files (hooks, world, etc.)
  require:
    - e2e/support/hooks.ts
    - e2e/step-definitions/**/*.ts

  # Load TypeScript support
  requireModule:
    - ts-node/register

  # Feature files location
  spec:
    - e2e/features/army-building.feature
    - e2e/features/game-session.feature
    - e2e/features/rules-selection.feature
    - e2e/features/view-persistence.feature
    - e2e/features/panic.feature

  # Test formatter
  format:
    - summary
    - html:e2e/reports/cucumber-report.html
    - json:e2e/reports/cucumber-report.json
    - junit:e2e/reports/junit-report.xml

  # Additional options
  retry: 0
  dryRun: false
  failFast: false
  strict: true
  parallel: 0
  publishQuiet: false

  # Language
  language: ru

  # Tags for filtering scenarios
  tags: "not @wip"

  # Environment variables for E2E tests
  env:
    BASE_URL: http://localhost:3001
    PORT: 3001
