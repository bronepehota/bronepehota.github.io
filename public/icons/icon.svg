<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - Military dark slate -->
  <rect width="512" height="512" fill="#0f172a" rx="80" ry="80"/>

  <!-- Border ring -->
  <circle cx="256" cy="256" r="230" fill="none" stroke="#ef4444" stroke-width="8" opacity="0.8"/>

  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.4"/>

  <!-- БП text in center -->
  <text x="256" y="256"
        font-family="Arial, sans-serif"
        font-size="180"
        font-weight="bold"
        fill="#ef4444"
        text-anchor="middle"
        dominant-baseline="central">БП</text>

  <!-- Corner accents -->
  <path d="M 80 120 L 80 80 L 120 80" stroke="#ef4444" stroke-width="12" fill="none" opacity="0.6"/>
  <path d="M 392 80 L 432 80 L 432 120" stroke="#ef4444" stroke-width="12" fill="none" opacity="0.6"/>
  <path d="M 432 392 L 432 432 L 392 432" stroke="#ef4444" stroke-width="12" fill="none" opacity="0.6"/>
  <path d="M 120 432 L 80 432 L 80 392" stroke="#ef4444" stroke-width="12" fill="none" opacity="0.6"/>
</svg>
