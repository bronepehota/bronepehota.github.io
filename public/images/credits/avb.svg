<?xml version="1.0" encoding="utf-8"?>
<!-- АВБ — Альтернативная Версия Бронепехоты. Маркировка всего не-Технологовского
     (сообщественного) контента. Два смещённых скруглённых квадрата: «альтернативная
     версия» того же самого. Изумрудный тон (#10b981) — отличается от остальных источников. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" role="img" aria-label="АВБ">
  <rect x="2.5" y="2.5" width="14" height="14" rx="3.5" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="2"/>
  <rect x="7.5" y="7.5" width="14" height="14" rx="3.5" fill="#10b981"/>
</svg>
